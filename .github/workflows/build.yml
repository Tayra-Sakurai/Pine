name: Test and build the solution
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Please enter the release tag.
        type: string
        required: true
      environment:
        description: Select environment
        type: environment
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build WinUI package
    runs-on: windows-latest
    steps:
      - name: Build WinUI package
        uses: $/.github/workflows/build
        with:
          dotnet_version: 11.0.x
          build_target: net11.0-windows10.0.26100.0
          solution_name: Pine
          cert-key: ${{ secrets.PFX_CERT_KEY }}

  release:
    runs-on: ubuntu-latest
    name: Make a release
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: Packages

      - name: Make a release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            Packages/**/*.msixbundle
            Packages/**/*.msix
            Packages/**/*.cer
          make_latest: true
          generate_release_notes: true
          draft: true